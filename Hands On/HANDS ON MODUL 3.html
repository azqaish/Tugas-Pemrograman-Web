</head>
<body>
    <article class="showcase-card showcase-card--featured">
         <video class="showcase-card__media" controls poster="logo unhas.png">
            <source src="video.webm" type="video/webm">
            <source src="video.mp4" type="video/mp4">
            Browser Anda tidak mendukung pemutaran video HTML5 natif.
        </video>

        <div class="showcase-card__content">
            <h1 class="showcase-card__title">Video Ajar: Dasar Client-Side Logic</h1>

            <h1 class="showcase-card__title">Dengarkan Penjelasan Audio</h1>
            <audio class="showcase-card__auto-player" controls>
                <source src="audio.mp3" type="audio/mpeg">
                <source src="audio.ogg" type="audio/ogg">
            </audio>
        </div>
    </article>
