<!DOCTYPE html>
<html lang="id">   
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Platform e-Learning</title>
        <link rel="stylesheet" href="./03-tugas-style.css"> 
    </head>

    <body> 
        <header>
            <h1>Selamat datang di Platform e-Learning</h1>
        </header>
        <picture>
              <source media="(min-width: 800px)"srcset="learn.webp" type="image/webp">
                <img src="learn cropver.webp" alt="Ilustrasi">
        </picture>

        <article class="showcase-card showcase-card--featured">
            <video class="showcase-card__media" controls poster="math.jpg">
                <source src="video.webm" type="video/webm">
                <source src="video.mp4" type="video/mp4">
                Browser Anda tidak mendukung pemutaran video HTML5 natif.
            </video>

            <div class="showcase-card showcase-card--active">
                <div class="showcase-card__content">
                    <h1 class="showcase-card__title">Video Ajar: Matematika Dasar</h1>
                    <p class="showcase-card__description">
                        Materi video di atas menjelaskan konsep dasar matematika.</p>
                    <h1 class="showcase-card__title">Dengarkan Penjelasan Audio</h1>

                        <audio class="showcase-card__auto-player" controls>
                            <source src="audio.mp3" type="audio/mpeg">
                            <source src="audio.ogg" type="audio/ogg">
                        </audio>
                </div>
            </div>
        </article>
    </body>
    
</html>
